name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: ./scripts/prepare-oidc.sh
      - run: go test -race ./...
      - run: go vet ./...
      - run: cd .build/oidc && go test ./...
      - run: go build -trimpath -o bin/caddy ./cmd/caddy
      - run: bin/caddy adapt --config examples/keycloak/Caddyfile --pretty > /tmp/caddy.json
      - run: docker compose -f examples/keycloak/compose.yaml config --quiet
  keycloak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: ./scripts/prepare-oidc.sh
      - run: docker compose -f examples/keycloak/compose.yaml up --build -d
      - run: go run ./examples/e2e
      - if: failure()
        run: docker compose -f examples/keycloak/compose.yaml logs --tail=100
      - if: always()
        run: docker compose -f examples/keycloak/compose.yaml down -v
